# Triggered when the cloud agent commits a puzzle draft JSON to drafts/*.json.
# Requires two GitHub Secrets (no Anthropic key needed):
#   SUPABASE_URL             — https://qxnsevneayiuvpbmnzyu.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY — your sb_secret_... key

name: Insert puzzle draft into Supabase

on:
  push:
    paths:
      - 'drafts/*.json'

jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find new draft file
        id: draft
        run: |
          FILE=$(git diff --name-only HEAD~1 HEAD -- 'drafts/*.json' | head -1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Insert draft into Supabase
        if: steps.draft.outputs.file != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          FILE="${{ steps.draft.outputs.file }}"
          DATE=$(basename "$FILE" .json)
          ROUNDS=$(cat "$FILE")
          RESPONSE=$(curl -s -w '\nHTTP %{http_code}' -X POST \
            "$SUPABASE_URL/rest/v1/puzzle_drafts" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"rounds\": $ROUNDS, \"notes\": \"Generated by cloud agent on $DATE\"}")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"id"' && echo "Draft inserted." || (echo "Insert failed." && exit 1)
